    <path d="M-3-14Q-9-24 0-27" fill="none" stroke="#f0f6fc" stroke-width="3"/>
    <circle cx="2" cy="-27" r="3" fill="#f85149"><animate attributeName="opacity" values="1;.2;1" dur=".45s" repeatCount="indefinite"/></circle>
