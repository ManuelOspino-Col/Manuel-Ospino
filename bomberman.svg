      <rect x="6" y="112" width="7" height="12" fill="#58a6ff"/><rect x="18" y="112" width="7" height="12" fill="#58a6ff"/>
      <rect x="-4" y="124" width="15" height="5" rx="2" fill="#f0f6fc"/><rect x="16" y="124" width="15" height="5" rx="2" fill="#f0f6fc"/>
    </g>
  </g>
  <g transform="translate(510 111)">
